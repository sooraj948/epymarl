# EPyMARL QMIX optimization; recurrent history and previous action for LBF.
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0
runner: episode
buffer_size: 5000
batch_size_run: 1
batch_size: 32
target_update_interval_or_tau: 200
lr: 0.0005
gamma: 0.99
grad_norm_clip: 10
hidden_dim: 64
agent: rnn
mac: basic_mac
obs_agent_id: True
obs_last_action: True
obs_individual_obs: False
use_rnn: True
standardise_returns: False
standardise_rewards: True
agent_output_type: q
learner: qmix_lbf_learner
double_q: True
mixer: qmix
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64
name: maca_qmix_sum
maca:
  mode: team_sum
  beta: 0.1
  beta_threshold: -0.01
  beta_ramp: 0.35
  auxiliary_weight: 1.0
  n_samples: 16
  fit_freq: 100
  mixer_epochs: 20
  warmup_episodes: 0
  shape_wins: False
