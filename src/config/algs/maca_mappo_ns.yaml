# Matched feedforward, separate-parameter MAPPO comparison in original reward units.
action_selector: soft_policies
mask_before_softmax: True
runner: parallel
buffer_size: 10
batch_size_run: 10
batch_size: 10
target_update_interval_or_tau: 200
lr: 0.0003
hidden_dim: 64
obs_agent_id: False
obs_last_action: False
obs_individual_obs: False
mac: non_shared_mac
agent: rnn_ns
agent_output_type: pi_logits
entropy_coef: 0.01
use_rnn: False
standardise_returns: False
standardise_rewards: False
q_nstep: 5
critic_type: cv_critic_ns
epochs: 4
eps_clip: 0.2
use_cuda: False
common_reward: True
reward_scalarisation: sum
env_args:
  key: lbforaging:Foraging-8x8-2p-2f-coop-v3
  time_limit: 50
  pretrained_wrapper: null
t_max: 1000000
test_nepisode: 20
test_interval: 10000
log_interval: 5000
runner_log_interval: 5000
learner_log_interval: 5000
save_model: True
save_model_interval: 100000
learner: maca_ppo_learner
name: maca_mappo_ns
maca:
  reward_standardization: environment  # shaped additionally requires standardise_rewards=True.
  beta: 0.1
  beta_threshold: -0.01
  beta_ramp: 0.35
  ppo_gae_lambda: 0.95  # Mixer teacher only; the policy uses q_nstep above.
  n_samples: 16
  fit_freq: 100
  mixer_epochs: 20
  warmup_episodes: 0
  shape_wins: False
